<!DOCTYPE html>
<html>
<head>
<meta charset="utf8">
<title>Waarna</title>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#4a0d1c">
<link rel="manifest" href="manifest.webmanifest">
<style>
html,body{margin:0;height:100%;background:#4a0d1c;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:#ffd98a}
canvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block;z-index:1}
#vid{position:fixed;left:0;top:0;width:100%;height:100%;z-index:0;display:none}
#bar{position:fixed;left:0;right:0;top:0;padding:8px 52px 8px 8px;padding-top:calc(max(env(safe-area-inset-top),24px) + 14px);display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap;z-index:5}
button,select,label.b{padding:9px 12px;font-size:14px;border:0;border-radius:8px;background:#ffb703;color:#000;cursor:pointer}
#menu{position:fixed;right:8px;top:calc(max(env(safe-area-inset-top),24px) + 14px);z-index:7;padding:9px 12px}
#tot{width:100%;text-align:center;font-size:26px;font-weight:bold;text-shadow:0 2px 6px #000}
#err{position:fixed;bottom:0;left:0;right:0;background:#900;color:#fff;font-size:14px;padding:6px;z-index:9;display:none}
#file{display:none}
</style>
</head>
<body>
<video id="vid" autoplay muted playsinline></video>
<canvas id="c"></canvas>
<button id="menu">Menu</button>
<div id="bar">
<div id="tot">Total: A$0</div>
<button id="cam">Camera</button>
<button id="flip">Flip camera</button>
<select id="cur">
<option value="AUD">AUD</option>
<option value="USD">USD</option>
<option value="GBP">GBP</option>
<option value="CAD">CAD</option>
<option value="INR">INR 2000</option>
</select>
<label class="b" for="file">Note photo</label>
<input type="file" id="file" accept="image/*">
<select id="crop">
<option value="full">Whole photo</option>
<option value="top">Top half</option>
<option value="bottom">Bottom half</option>
<option value="left">Left half</option>
<option value="right">Right half</option>
</select>
<select id="trim">
<option value="0">Trim 0%</option>
<option value="0.02">Trim 2%</option>
<option value="0.04">Trim 4%</option>
<option value="0.06">Trim 6%</option>
<option value="0.08">Trim 8%</option>
<option value="0.1">Trim 10%</option>
</select>
<button id="a">Auto toss</button>
<button id="b">Burst</button>
<button id="snd">Sound on</button>
<button id="r">Reset</button>
<button id="f">Full screen</button>
</div>
<div id="err"></div>
<script>
function showErr(m){var e=document.getElementById('err');e.style.display='block';e.textContent=m}
window.onerror=function(m,s,l){showErr('Error: '+m+' line '+l)};
var CUR={
AUD:{sym:'A$',face:'$100',val:100,bg:'#2e9e5b',edge:'#d8f5c0',ink:'#eaffd9'},
USD:{sym:'US$',face:'$100',val:100,bg:'#85a98b',edge:'#2f4f3a',ink:'#17331f'},
GBP:{sym:'\u00A3',face:'\u00A350',val:50,bg:'#c0392b',edge:'#ffd0c9',ink:'#fff0ee'},
CAD:{sym:'C$',face:'$100',val:100,bg:'#9a6b3a',edge:'#f0d9b5',ink:'#fff3e0'},
INR:{sym:'\u20B9',face:'\u20B92000',val:2000,bg:'#b0407a',edge:'#f3c6dc',ink:'#fff0f7'}
};
/* Default crop and trim for the photos in the notes folder.
Crop options: full, top, bottom, left, right. Trim: 0 to 0.1 */
var DEFCROP={AUD:'full',USD:'full',GBP:'full',CAD:'full',INR:'full'};
var DEFTRIM={AUD:0,USD:0,GBP:0,CAD:0,INR:0};
var cur='AUD',UP=Math.cos(Math.PI);
var FILL=0.96,RS=0.16,VERSION='v8';
/* Milestones: first at FIRST_MILE, then every STEP_MILE */
var FIRST_MILE=1000,STEP_MILE=5000,DHOL_FILE='sounds/dhol.mp3';
var mileN=0,banner=null;
var hideMain=false,burstDone=true;
var c=document.getElementById('c'),x=c.getContext('2d');
var pc=document.createElement('canvas'),pileN=0;
c.style.touchAction='none';
var bar=document.getElementById('bar');bar.style.pointerEvents='none';
Array.prototype.forEach.call(bar.children,function(e){e.style.pointerEvents='auto'});
function size(){c.width=window.innerWidth;c.height=window.innerHeight;pc.width=c.width;pc.height=c.height;pileN=0}
size();window.addEventListener('resize',size);
function K(){return Math.max(0.7,Math.min(c.width,c.height)/600)}
var de=document.documentElement;
if(!(de.requestFullscreen||de.webkitRequestFullscreen)){
document.getElementById('f').textContent='How to go full screen';
document.getElementById('f').addEventListener('click',function(){showErr('Tap Share, then Add to Home Screen, and open Waarna from the new icon.')});
}

function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function fetchKey(k){var v=null;try{v=localStorage.getItem(k)}catch(e){}return v}

/* Sound */
var AC=null,lastSnd=0,noiseBuf=null,soundOn=fetchKey('sound')!=='off';
var dholBuf=null,dholTried=false;
function loadDhol(){
var xhr=new XMLHttpRequest();
xhr.open('GET',DHOL_FILE);xhr.responseType='arraybuffer';
xhr.onload=function(){
if(xhr.status!==200&&xhr.status!==0)return;
try{AC.decodeAudioData(xhr.response,function(b){dholBuf=b},function(){})}catch(e){}
};
xhr.send();
}
function unlockAudio(){
try{
if(!AC){var A=window.AudioContext||window.webkitAudioContext;if(A)AC=new A();}
if(AC&&AC.state==='suspended')AC.resume();
if(AC&&!dholTried){dholTried=true;loadDhol();}
}catch(e){}
}
document.addEventListener('pointerdown',unlockAudio);
document.addEventListener('touchend',unlockAudio);
function getNoise(){
if(noiseBuf||!AC)return noiseBuf;
var len=Math.floor(AC.sampleRate*0.4),b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);
for(var i=0;i<len;i++)d[i]=Math.random()*2-1;
noiseBuf=b;return b;
}
function landSound(){
if(!soundOn||!AC||AC.state!=='running')return;
var now=AC.currentTime;
if(now-lastSnd<0.04)return;
lastSnd=now;
var nb=getNoise();if(!nb)return;
var src=AC.createBufferSource();src.buffer=nb;
src.playbackRate.value=0.8+Math.random()*0.5;
var f=AC.createBiquadFilter();f.type='bandpass';
f.frequency.value=1800+Math.random()*2600;f.Q.value=0.8+Math.random()*1.5;
var g=AC.createGain();
var dur=0.08+Math.random()*0.1,vol=0.10+Math.random()*0.08;
g.gain.setValueAtTime(0.0001,now);
g.gain.exponentialRampToValueAtTime(vol,now+0.008);
g.gain.exponentialRampToValueAtTime(0.0001,now+dur);
src.connect(f);f.connect(g);g.connect(AC.destination);
src.start(now,Math.random()*0.2);src.stop(now+dur+0.02);
var o=AC.createOscillator(),og=AC.createGain();
o.type='sine';
o.frequency.setValueAtTime(140+Math.random()*80,now);
o.frequency.exponentialRampToValueAtTime(60,now+0.07);
og.gain.setValueAtTime(0.0001,now);
og.gain.exponentialRampToValueAtTime(0.06+Math.random()*0.04,now+0.005);
og.gain.exponentialRampToValueAtTime(0.0001,now+0.09);
o.connect(og);og.connect(AC.destination);o.start(now);o.stop(now+0.1);
}
function drumHit(t,vol,bass){
var nb=getNoise();
if(bass){
var o=AC.createOscillator(),g=AC.createGain();
o.type='sine';
o.frequency.setValueAtTime(130,t);
o.frequency.exponentialRampToValueAtTime(70,t+0.08);
o.frequency.exponentialRampToValueAtTime(55,t+0.5);
g.gain.setValueAtTime(0.0001,t);
g.gain.exponentialRampToValueAtTime(vol*1.4,t+0.006);
g.gain.exponentialRampToValueAtTime(0.0001,t+0.55);
o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+0.6);
var o2=AC.createOscillator(),g2=AC.createGain();
o2.type='triangle';
o2.frequency.setValueAtTime(190,t);
o2.frequency.exponentialRampToValueAtTime(110,t+0.2);
g2.gain.setValueAtTime(vol*0.5,t);
g2.gain.exponentialRampToValueAtTime(0.0001,t+0.25);
o2.connect(g2);g2.connect(AC.destination);o2.start(t);o2.stop(t+0.3);
if(nb){
var s=AC.createBufferSource();s.buffer=nb;
var lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;
var ng=AC.createGain();
ng.gain.setValueAtTime(vol*0.7,t);
ng.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
s.connect(lp);lp.connect(ng);ng.connect(AC.destination);s.start(t);s.stop(t+0.06);
}
}else{
var q=AC.createOscillator(),qg=AC.createGain();
q.type='triangle';
q.frequency.setValueAtTime(460,t);
q.frequency.exponentialRampToValueAtTime(330,t+0.1);
qg.gain.setValueAtTime(0.0001,t);
qg.gain.exponentialRampToValueAtTime(vol*0.9,t+0.003);
qg.gain.exponentialRampToValueAtTime(0.0001,t+0.14);
q.connect(qg);qg.connect(AC.destination);q.start(t);q.stop(t+0.16);
var r=AC.createOscillator(),rg=AC.createGain();
r.type='sine';r.frequency.value=780+Math.random()*60;
rg.gain.setValueAtTime(vol*0.3,t);
rg.gain.exponentialRampToValueAtTime(0.0001,t+0.09);
r.connect(rg);rg.connect(AC.destination);r.start(t);r.stop(t+0.1);
if(nb){
var s2=AC.createBufferSource();s2.buffer=nb;
var hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=2500;
var hg=AC.createGain();
hg.gain.setValueAtTime(vol*0.9,t);
hg.gain.exponentialRampToValueAtTime(0.0001,t+0.04);
s2.connect(hp);hp.connect(hg);hg.connect(AC.destination);s2.start(t);s2.stop(t+0.05);
}
}
}
var dholSrc=null,dholAgain=false,rollUntil=0;
function playDhol(){
var s0=AC.createBufferSource(),g0=AC.createGain();
s0.buffer=dholBuf;g0.gain.value=0.9;
s0.connect(g0);g0.connect(AC.destination);
dholSrc=s0;
s0.onended=function(){
dholSrc=null;
if(dholAgain){dholAgain=false;playDhol()}
};
s0.start();
var hp0=[],dd=Math.min(dholBuf.duration,3),ee=0;
while(ee<dd){hp0.push(30,70);ee+=0.1}
hp0.push(200);
haptic(hp0);
}
function drumRoll(level){
if(!soundOn||!AC||AC.state!=='running')return;
if(dholBuf){
if(dholSrc){dholAgain=true;return}
playDhol();
return;
}
if(AC.currentTime<rollUntil)return;
var t=AC.currentTime+0.02,len=1.2+level*0.2,el=0,i=0,pat=[];
while(el<len){
var p=el/len;
drumHit(t+el,0.12+p*0.35,i%6===0);
pat.push(20,Math.round(1000*(0.13-0.09*p))-20);
el+=0.13-0.09*p;i+=1;
}
drumHit(t+el+0.08,0.6,true);
drumHit(t+el+0.08,0.35,false);
var nb=getNoise();
if(nb){
var s=AC.createBufferSource();s.buffer=nb;s.loop=true;
var hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=4000;
var cg=AC.createGain();
cg.gain.setValueAtTime(0.0001,t+el+0.08);
cg.gain.exponentialRampToValueAtTime(0.25,t+el+0.09);
cg.gain.exponentialRampToValueAtTime(0.0001,t+el+0.8);
s.connect(hp);hp.connect(cg);cg.connect(AC.destination);s.start(t+el+0.08);s.stop(t+el+0.85);
}
rollUntil=t+el+0.9;
pat.push(200);
haptic(pat);
}
function mileTarget(n){return n===0?FIRST_MILE:STEP_MILE*n}
function checkMile(){
if(total===0){mileN=0;return}
var hit=0;
while(total>=mileTarget(mileN)){hit=mileTarget(mileN);mileN+=1}
if(hit>0){
drumRoll(Math.min(mileN,6));
banner={t:Date.now(),txt:CUR[cur].sym+hit.toLocaleString()+'!'};
}
}
var sndBtn=document.getElementById('snd');
sndBtn.textContent=soundOn?'Sound on':'Sound off';
sndBtn.addEventListener('click',function(){
soundOn=!soundOn;store('sound',soundOn?'on':'off');
sndBtn.textContent=soundOn?'Sound on':'Sound off';
});

/* Haptics and LED flash (Android Chrome; iPhone needs the native app) */
function haptic(ms){try{if(navigator.vibrate)navigator.vibrate(ms)}catch(e){}}
function flash(){
if(!stream)return;
var t=stream.getVideoTracks()[0];
if(!t||!t.getCapabilities||!t.getCapabilities().torch)return;
t.applyConstraints({advanced:[{torch:true}]}).then(function(){
setTimeout(function(){t.applyConstraints({advanced:[{torch:false}]}).catch(function(){})},80);
}).catch(function(){});
}

var vid=document.getElementById('vid');
vid.muted=true;vid.style.objectFit='cover';
var camOn=false,facing='environment',stream=null,ms=1;
function stopCam(){if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}}
function startCam(){
stopCam();
if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){showErr('Camera not available here. Open the hosted https link in Safari or Chrome.');return}
navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing}},audio:false}).then(function(s){
stream=s;vid.srcObject=s;vid.style.display='block';
vid.style.transform=facing==='user'?'scaleX(-1)':'none';
var p=vid.play();if(p&&p.catch)p.catch(function(){});
camOn=true;ms=0.55;document.getElementById('cam').textContent='Camera off';
}).catch(function(e){showErr('Camera blocked: '+e.name+'. Allow camera for this site in browser settings.')});
}
function camOff(){stopCam();vid.style.display='none';camOn=false;ms=1;document.getElementById('cam').textContent='Camera'}
document.getElementById('cam').addEventListener('click',function(){if(camOn){camOff()}else{startCam()}});
document.getElementById('flip').addEventListener('click',function(){facing=facing==='environment'?'user':'environment';if(camOn)startCam()});

var imgs={},crops={},trims={};
function tryFiles(k,ex){
if(!ex.length){imgs[k]=null;return}
var im=new Image();
im.onload=function(){imgs[k]=im};
im.onerror=function(){tryFiles(k,ex.slice(1))};
im.src='notes/'+k.toLowerCase()+'.'+ex[0];
}
function loadImg(k){
var d=fetchKey('note_'+k);
var sc=fetchKey('crop_'+k),st=fetchKey('trim_'+k);
crops[k]=sc||DEFCROP[k]||'full';trims[k]=st!==null?parseFloat(st):(DEFTRIM[k]||0);
if(d){var im=new Image();im.onload=function(){imgs[k]=im};im.src=d}
else{tryFiles(k,['jpg','png','jpeg','webp'])}
}
for(var k in CUR){loadImg(k)}
var cropSel=document.getElementById('crop'),trimSel=document.getElementById('trim');
function syncSel(){cropSel.value=crops[cur]||'full';trimSel.value=String(trims[cur]||0)}

function srcRect(im,mode,t){
var w=im.width,h=im.height,r=[0,0,w,h];
if(mode==='top')r=[0,0,w,h/2];
if(mode==='bottom')r=[0,h/2,w,h/2];
if(mode==='left')r=[0,0,w/2,h];
if(mode==='right')r=[w/2,0,w/2,h];
var dx=r[2]*t,dy=r[3]*t;
return [r[0]+dx,r[1]+dy,r[2]-2*dx,r[3]-2*dy];
}

var total=0,flying=[],rain=[],held=null,drag=null,hist=[],tossed=false;
var tot=document.getElementById('tot');
function upd(){tot.textContent='Total: '+CUR[cur].sym+total.toLocaleString()+' ('+VERSION+')';checkMile()}
function home(){return {x:c.width/2,y:c.height*(camOn?0.76:0.52)}}
function fresh(){var h=home();held={x:h.x,y:h.y,r:0,s:0.3}}
fresh();

function rr(px,py,w,h,r){
x.beginPath();
x.moveTo(px+r,py);x.lineTo(px+w-r,py);x.quadraticCurveTo(px+w,py,px+w,py+r);
x.lineTo(px+w,py+h-r);x.quadraticCurveTo(px+w,py+h,px+w-r,py+h);
x.lineTo(px+r,py+h);x.quadraticCurveTo(px,py+h,px,py+h-r);
x.lineTo(px,py+r);x.quadraticCurveTo(px,py,px+r,py);
x.closePath();
}
function drawNote(px,py,r,s,key,ph,lift){
var q=CUR[key],im=imgs[key],sr=null,ratio=0.433;
if(im){sr=srcRect(im,crops[key]||'full',trims[key]||0);ratio=sr[3]/sr[2]}
var turn=(c.height>c.width)&&ratio<1;
var W,H;
if(turn){W=Math.min(c.height*FILL,c.width*FILL/ratio);H=W*ratio}
else{W=Math.min(c.width*FILL,c.height*FILL/ratio);H=W*ratio}
var flex=0.78+0.22*Math.abs(Math.cos(ph));
var sheen=0.12+0.3*Math.abs(Math.sin(ph));
x.save();x.translate(px,py);x.rotate(r);x.scale(s,s*flex);
if(turn)x.rotate(Math.PI/2);
x.shadowColor='rgba(0,0,0,0.5)';x.shadowBlur=14+lift*34;x.shadowOffsetY=6+lift*34;
var hx=-W/2,hy=-H/2,cr=Math.max(5,W*0.012);
if(im){
rr(hx,hy,W,H,cr);x.fillStyle='#f4f4ee';x.fill();
x.shadowColor='transparent';
x.save();rr(hx,hy,W,H,cr);x.clip();
x.drawImage(im,sr[0],sr[1],sr[2],sr[3],hx,hy,W,H);
}else{
rr(hx,hy,W,H,cr);x.fillStyle=q.bg;x.fill();
x.shadowColor='transparent';
x.save();rr(hx,hy,W,H,cr);x.clip();
x.fillStyle=q.ink;x.font='bold '+(H*0.42)+'px Arial';x.textAlign='center';x.textBaseline='middle';
x.fillText(q.face,0,0);
}
var g=x.createLinearGradient(hx,hy,W/2,H/2);
g.addColorStop(0,'rgba(255,255,255,'+sheen+')');
g.addColorStop(0.45,'rgba(255,255,255,0)');
g.addColorStop(1,'rgba(0,0,0,'+(0.1+0.12*(1-flex))+')');
x.fillStyle=g;x.fillRect(hx,hy,W,H);
var b=x.createLinearGradient(hx,0,W/2,0);
b.addColorStop(0,'rgba(0,0,0,0.12)');b.addColorStop(0.15,'rgba(0,0,0,0)');
b.addColorStop(0.85,'rgba(0,0,0,0)');b.addColorStop(1,'rgba(0,0,0,0.12)');
x.fillStyle=b;x.fillRect(hx,hy,W,H);
x.restore();
x.strokeStyle='rgba(255,255,255,0.55)';x.lineWidth=1.5;rr(hx,hy,W,H,cr);x.stroke();
x.restore();
}

function pos(e){var b=c.getBoundingClientRect();return {x:e.clientX-b.left,y:e.clientY-b.top}}
c.addEventListener('pointerdown',function(e){
if(hideMain)return;
var p=pos(e);drag={ox:held.x-p.x,oy:held.y-p.y};hist=[{x:p.x,y:p.y,t:Date.now()}];
try{c.setPointerCapture(e.pointerId)}catch(z){}
});
c.addEventListener('pointermove',function(e){
if(!drag)return;
var p=pos(e);held.x=p.x+drag.ox;held.y=p.y+drag.oy;
var h=home();held.r=(held.x-h.x)*0.0006;
hist.push({x:p.x,y:p.y,t:Date.now()});if(hist.length>8)hist.shift();
});
function release(){
if(!drag)return;drag=null;
var n=hist.length;if(n<2){return}
var a=hist[0],b=hist[n-1],now=Date.now();
for(var i=0;i<n;i++){if(now-hist[i].t<100){a=hist[i];break}}
var dt=Math.max(b.t-a.t,1);
var vx=(b.x-a.x)/dt*16,vy=(b.y-a.y)/dt*16;
if(Math.sqrt(vx*vx+vy*vy)>7)toss(vx,vy);
}
c.addEventListener('pointerup',release);
c.addEventListener('pointercancel',release);
document.addEventListener('touchmove',function(e){e.preventDefault()},{passive:false});

function toss(vx,vy){
haptic(25);flash();
flying.push({x:held.x,y:held.y,vx:vx,vy:vy,r:held.r,vr:vx*0.004,s:held.s*ms,key:cur,ph:0.3,vp:0.12+Math.random()*0.1,min:0.1*ms,pile:!camOn});
total+=CUR[cur].val;tossed=true;fresh();upd();
}
function floorY(k){return c.height-(18*k)-Math.min(pileN*0.35*k,c.height*0.22)*0.7}
function launch(){
var k=K(),g=0.35*k,tgt=c.height*(0.4+Math.random()*0.45);
rain.push({x:c.width*(0.08+Math.random()*0.84),y:c.height+60*k,vx:(Math.random()-Math.random())*3*k,vy:-Math.sqrt(2*g*tgt),
r:Math.random()*6.28,vr:(Math.random()-Math.random())*0.12,ph:Math.random()*6,vp:0.15+Math.random()*0.1,key:cur,g:g});
total+=CUR[cur].val;tossed=true;upd();
}
function landNote(n){
landSound();
var k=K(),lvl=Math.min(pileN*0.35*k,c.height*0.22);
var fy=c.height-(18*k)-lvl*(0.4+Math.random()*0.6);
var lx=Math.max(c.width*0.06,Math.min(c.width*0.94,n.x));
var sx=x;x=pc.getContext('2d');
drawNote(lx,fy,(Math.random()-Math.random())*0.9,RS,n.key,0.3,0.1);
x=sx;pileN+=1;
}

function loop(){
x.clearRect(0,0,c.width,c.height);
var k=K(),h=home();
if(hideMain&&burstDone&&rain.length===0){hideMain=false;fresh()}
if(!tossed&&!hideMain){
x.font='bold '+(20*k)+'px Arial';x.textAlign='center';x.textBaseline='middle';x.fillStyle='#ffd98a';
x.shadowColor='#000';x.shadowBlur=6;
x.fillText(camOn?'Point at someone and swipe up':'Swipe the note up, or tap Auto toss',h.x,c.height*0.94);
x.shadowBlur=0;x.shadowColor='transparent';
}
x.drawImage(pc,0,0);
var keep=[];
for(var j=0;j<rain.length;j++){
var n=rain[j];
n.vy+=n.g;n.x+=n.vx;n.y+=n.vy;n.r+=n.vr;n.ph+=n.vp;
if(n.vy>0&&n.y>floorY(k)){landNote(n)}
else{drawNote(n.x,n.y,n.r,RS,n.key,n.ph,0.15);keep.push(n)}
}
rain=keep;
var alive=[];
for(var i=0;i<flying.length;i++){
var f=flying[i];
f.x+=f.vx;f.y+=f.vy;f.r+=f.vr;f.ph+=f.vp;
if(f.pile){
f.vy+=0.35*k;f.s+=(RS-f.s)*0.07;
if(f.vy>0&&f.y>floorY(k)){landNote(f);continue}
drawNote(f.x,f.y,f.r,f.s,f.key,f.ph,0.6);
alive.push(f);
}else{
f.vy+=0.18*k;f.s*=0.978;
if(f.s<=f.min||f.y>c.height+400)continue;
x.globalAlpha=Math.min(1,f.s/ms*2.2);
drawNote(f.x,f.y,f.r,f.s,f.key,f.ph,1);
x.globalAlpha=1;
alive.push(f);
}
}
flying=alive;
if(!hideMain){
if(!drag){held.x+=(h.x-held.x)*0.18;held.y+=(h.y-held.y)*0.18;held.r+=(0-held.r)*0.18}
held.s+=(1-held.s)*0.15;
var bob=drag?0:Math.sin(Date.now()/500)*6*k;
var t=Date.now()/1400;
drawNote(held.x,held.y+bob,held.r,held.s*ms,cur,drag?(held.x-h.x)*0.004+0.4:Math.sin(t)*0.25,drag?0.8:0.25);
}
if(banner){
var age=(Date.now()-banner.t)/1000;
if(age>2.6){banner=null}
else{
x.save();
x.globalAlpha=Math.min(1,2.6-age);
x.font='bold '+(64*k*(1+Math.max(0,0.3-age)))+'px Arial';
x.textAlign='center';x.textBaseline='middle';
x.fillStyle='#ffd98a';x.shadowColor='#000';x.shadowBlur=14;
x.fillText(banner.txt,c.width/2,c.height*0.3);
x.restore();
}
}
requestAnimationFrame(loop);
}
var autoT=null,autoBtn=document.getElementById('a');
function autoToss(){
if(drag||hideMain)return;
var k=K();
toss((Math.random()-Math.random())*5*k,-(20+Math.random()*10)*k);
}
autoBtn.addEventListener('click',function(){
if(autoT){clearInterval(autoT);autoT=null;autoBtn.textContent='Auto toss'}
else{autoToss();autoT=setInterval(autoToss,650);autoBtn.textContent='Stop auto'}
});
document.getElementById('b').addEventListener('click',function(){
if(!burstDone)return;
hideMain=true;burstDone=false;drag=null;
var n=0,id=setInterval(function(){
launch();n+=1;
if(n>=30){clearInterval(id);burstDone=true}
},50);
});
document.getElementById('cur').addEventListener('change',function(e){cur=e.target.value;total=0;fresh();upd();syncSel()});
cropSel.addEventListener('change',function(e){crops[cur]=e.target.value;store('crop_'+cur,e.target.value)});
trimSel.addEventListener('change',function(e){trims[cur]=parseFloat(e.target.value);store('trim_'+cur,e.target.value)});
document.getElementById('r').addEventListener('click',function(){
flying=[];rain=[];total=0;fresh();upd();pc.width=c.width;pileN=0;hideMain=false;burstDone=true;
if(autoT){clearInterval(autoT);autoT=null;autoBtn.textContent='Auto toss'}
});
document.getElementById('f').addEventListener('click',function(){
if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}
else{var f=de.requestFullscreen||de.webkitRequestFullscreen;if(f)f.call(de)}
});
var shown=true;
document.getElementById('menu').addEventListener('click',function(){shown=!shown;bar.style.display=shown?'flex':'none'});
document.getElementById('file').addEventListener('change',function(e){
var fl=e.target.files[0];if(!fl)return;
var rd=new FileReader();
rd.onload=function(){
var im=new Image();
im.onload=function(){
var m=1600,sc=Math.min(1,m/Math.max(im.width,im.height)),cv=document.createElement('canvas');
cv.width=Math.round(im.width*sc);cv.height=Math.round(im.height*sc);
cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
var d=cv.toDataURL('image/jpeg',0.92);
store('note_'+cur,d);
var n=new Image();n.onload=function(){imgs[cur]=n};n.src=d;
};
im.src=rd.result;
};
rd.readAsDataURL(fl);
e.target.value='';
});
upd();syncSel();loop();
</script>
</body>
</html>
